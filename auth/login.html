<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sparkiddo — Sign In</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.39.3/umd/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f7f3ff;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;padding:20px}
  .blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.15;pointer-events:none}
  .b1{width:300px;height:300px;background:#a29bfe;top:-80px;left:-60px}
  .b2{width:260px;height:260px;background:#55efc4;bottom:-60px;right:-40px}
  .card{background:#fff;border-radius:28px;padding:36px 32px;width:100%;max-width:420px;box-shadow:0 12px 40px rgba(162,155,254,.18);position:relative;z-index:1}
  .logo{font-family:'Fredoka One',cursive;font-size:1.8rem;background:linear-gradient(135deg,#6c5ce7,#fd79a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin-bottom:4px}
  .subtitle{text-align:center;font-size:.82rem;color:#aaa;font-weight:700;letter-spacing:1px;margin-bottom:28px}
  .section-title{font-family:'Fredoka One',cursive;font-size:1.15rem;color:#444;margin-bottom:4px;text-align:center}
  .section-sub{font-size:.8rem;color:#888;font-weight:600;text-align:center;margin-bottom:24px}
  .form-group{margin-bottom:16px}
  label{display:block;font-size:.78rem;font-weight:800;color:#666;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
  input[type=email],input[type=password]{width:100%;padding:13px 16px;border:2px solid #e0d7ff;border-radius:14px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:600;color:#333;outline:none;transition:.2s;background:#fafaff}
  input:focus{border-color:#a29bfe;background:#fff;box-shadow:0 0 0 4px rgba(162,155,254,.12)}
  input.error{border-color:#fd79a8}
  .password-wrap{position:relative}
  .toggle-pw{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:#aaa}
  .forgot{display:block;text-align:right;font-size:.75rem;color:#a29bfe;font-weight:800;text-decoration:none;margin-top:6px}
  .forgot:hover{text-decoration:underline}
  .btn{width:100%;padding:15px;border-radius:14px;border:none;font-family:'Fredoka One',cursive;font-size:1.05rem;cursor:pointer;transition:.2s;margin-bottom:12px}
  .btn-primary{background:linear-gradient(135deg,#a29bfe,#6c5ce7);color:#fff;box-shadow:0 6px 18px rgba(108,92,231,.35)}
  .btn-primary:hover{transform:translateY(-2px)}
  .btn-primary:disabled{opacity:.6;transform:none;cursor:not-allowed}
  .btn-google{background:#fff;color:#555;border:2px solid #e0e0e0;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn-google:hover{border-color:#a29bfe;background:#fafaff}
  .divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:#ccc;font-size:.75rem;font-weight:700}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:#f0e8ff}
  .signup-link{text-align:center;font-size:.82rem;color:#888;font-weight:600;margin-top:16px}
  .signup-link a{color:#6c5ce7;font-weight:800;text-decoration:none}
  .signup-link a:hover{text-decoration:underline}
  .alert{padding:12px 16px;border-radius:12px;font-size:.82rem;font-weight:700;margin-bottom:16px;display:none;line-height:1.5}
  .alert.error{background:#fde8e8;color:#9b2335;border:1px solid #f7c1c1}
  .alert.success{background:#d4f8e8;color:#005f44;border:1px solid #9fe1cb}
  .alert.show{display:block}
  .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .google-icon{width:20px;height:20px}
  .guest-btn{width:100%;padding:11px;border-radius:14px;border:2px dashed #e0d7ff;background:transparent;font-family:'Fredoka One',cursive;font-size:.88rem;color:#a29bfe;cursor:pointer;transition:.2s;margin-top:4px}
  .guest-btn:hover{background:#f3efff}
  @media(max-width:480px){.card{padding:28px 20px}}
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="card">
  <div class="logo">🌟 sparkiddo</div>
  <div class="subtitle">SPARK CURIOSITY. WATCH IT GROW.</div>
  <div class="section-title">Welcome back!</div>
  <div class="section-sub">Sign in to see your child's progress 💚</div>

  <div class="alert" id="alert"></div>

  <button class="btn btn-google" onclick="signInGoogle()">
    <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84z"/></svg>
    Continue with Google
  </button>

  <div class="divider">or sign in with email</div>

  <form id="login-form" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="password-wrap">
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password"/>
        <button type="button" class="toggle-pw" onclick="togglePw()">👁️</button>
      </div>
      <a href="/forgot-password" class="forgot">Forgot password?</a>
    </div>
    <button type="submit" class="btn btn-primary" id="login-btn">Sign In 🌟</button>
  </form>

  <button class="guest-btn" onclick="continueAsGuest()">▷ Continue as guest (no save)</button>

  <div class="signup-link">Don't have an account? <a href="/register">Create one free</a></div>
</div>

<script>
const SUPABASE_URL  = 'https://cxpnedeqmtwufwmefpxc.supabase.co';
const SUPABASE_ANON = 'sb_publishable_0rg1ajXxVzZpwoF_5FY2MA_uwtxgAjZ';
const {createClient}=supabase;
const sb=createClient(SUPABASE_URL,SUPABASE_ANON);

// Check if already logged in
sb.auth.getSession().then(({data:{session}})=>{
  if(session)window.location.href='/play';
});

function showAlert(msg,type='error'){
  const el=document.getElementById('alert');
  el.innerHTML=msg;el.className=`alert ${type} show`;
}

function togglePw(){
  const inp=document.getElementById('password');
  const btn=document.querySelector('.toggle-pw');
  inp.type=inp.type==='password'?'text':'password';
  btn.textContent=inp.type==='password'?'👁️':'🙈';
}

async function handleLogin(e){
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const pw=document.getElementById('password').value;
  if(!email||!pw){showAlert('Please enter your email and password.');return;}
  const btn=document.getElementById('login-btn');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span>Signing in...';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){
    showAlert(error.message==='Invalid login credentials'
      ?'Incorrect email or password. Please try again.'
      :error.message);
    btn.disabled=false;btn.innerHTML='Sign In 🌟';
    return;
  }
  showAlert('✅ Welcome back! Loading your dashboard...','success');
  setTimeout(()=>window.location.href='/play',1200);
}

async function signInGoogle(){
  const {error}=await sb.auth.signInWithOAuth({
    provider:'google',
    options:{redirectTo:'https://sparkiddo.com/auth/callback'}
  });
  if(error)showAlert(error.message);
}

function continueAsGuest(){
  sessionStorage.setItem('sparkiddo_guest','true');
  window.location.href='/play';
}
</script>
</body>
</html>
