<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sparkiddo — Signing in...</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.39.3/umd/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f7f3ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;color:#6c5ce7}
  .logo{font-size:2.2rem;margin-bottom:16px;animation:pulse 1.5s ease-in-out infinite alternate}
  @keyframes pulse{from{opacity:.7;transform:scale(.95)}to{opacity:1;transform:scale(1.05)}}
  .msg{font-size:1.1rem;margin-bottom:8px;color:#6c5ce7}
  .sub{font-size:.82rem;color:#aaa;font-family:'Nunito',sans-serif;font-weight:600}
  .spinner{width:36px;height:36px;border:3px solid #f0e8ff;border-top-color:#a29bfe;border-radius:50%;animation:spin .8s linear infinite;margin:20px auto 0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{color:#e74c3c;font-size:.88rem;margin-top:16px;font-family:'Nunito',sans-serif;font-weight:700;text-align:center;max-width:320px}
</style>
</head>
<body>
<div class="logo">🌟</div>
<div class="msg">Signing you in...</div>
<div class="sub">Just a moment while we load Sparkiddo</div>
<div class="spinner"></div>
<div class="err" id="err"></div>

<script>
const SUPABASE_URL  = 'https://cxpnedeqmtwufwmefpxc.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4cG5lZGVxbXR3dWZ3bWVmcHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzODI0OTcsImV4cCI6MjA5Mzk1ODQ5N30.A-JRcutv_AyB7izhhT3hk86-5VZJpbU-EAofjGWL8Oc';
const {createClient} = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

async function handleCallback() {
  try {
    // Supabase automatically parses the URL hash/code on init
    const { data: { session }, error } = await sb.auth.getSession();

    if (error) throw error;

    if (session) {
      // Successful auth — redirect to play hub
      window.location.href = '/auth/play';
    } else {
      // No session — check if it's a password recovery
      const hash = window.location.hash;
      if (hash.includes('type=recovery')) {
        window.location.href = '/auth/forgot-password' + hash;
      } else {
        // Fallback — try exchanging code for session (PKCE flow)
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        if (code) {
          const { error: exchErr } = await sb.auth.exchangeCodeForSession(code);
          if (exchErr) throw exchErr;
          window.location.href = '/auth/play';
        } else {
          throw new Error('No session found. Please try signing in again.');
        }
      }
    }
  } catch (err) {
    document.querySelector('.msg').textContent = 'Something went wrong';
    document.querySelector('.sub').textContent = 'Please try again';
    document.querySelector('.spinner').style.display = 'none';
    document.getElementById('err').innerHTML =
      `${err.message} <br><br><a href="/auth/login" style="color:#6c5ce7">← Back to login</a>`;
  }
}

handleCallback();
</script>
</body>
</html>
