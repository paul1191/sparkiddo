<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparkiddo — Snake</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d0d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Press Start 2P',monospace;color:#fff}
  h1{color:#c084fc;font-size:1.4rem;margin-bottom:6px;text-shadow:0 0 10px #c084fc}
  .subtitle{color:#67e8f9;font-size:.5rem;margin-bottom:18px;letter-spacing:2px}
  #scoreboard{display:flex;gap:40px;margin-bottom:14px}
  .score-box{text-align:center}
  .score-label{font-size:.45rem;color:#a78bfa;margin-bottom:4px}
  .score-val{font-size:.9rem;color:#f0abfc}
  #canvas-wrap{position:relative}
  canvas{border:2px solid #7c3aed;box-shadow:0 0 24px #7c3aed88;border-radius:4px;display:block}
  #overlay{position:absolute;inset:0;background:#0d0d1acc;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px}
  #overlay h2{color:#f0abfc;font-size:1rem;margin-bottom:10px;text-shadow:0 0 8px #f0abfc}
  #overlay p{color:#67e8f9;font-size:.5rem;margin-bottom:20px}
  #overlay .final{color:#fbbf24;font-size:.65rem;margin-bottom:16px}
  button{background:#7c3aed;color:#fff;border:none;padding:10px 22px;font-family:'Press Start 2P',monospace;font-size:.55rem;border-radius:4px;cursor:pointer;box-shadow:0 0 12px #7c3aed}
  button:hover{background:#a855f7}
  #controls{margin-top:16px;font-size:.4rem;color:#6b7280;text-align:center;line-height:2}
  .kbd{background:#1e1b4b;border:1px solid #4c1d95;padding:2px 6px;border-radius:3px;color:#c4b5fd}
  #mobile-btns{display:none;margin-top:14px;flex-direction:column;align-items:center;gap:4px}
  .row{display:flex;gap:4px}
  .mbtn{width:48px;height:48px;background:#1e1b4b;border:2px solid #7c3aed;color:#c4b5fd;font-size:1.1rem;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mbtn:active{background:#7c3aed}
  @media(max-width:540px){#mobile-btns{display:flex}#controls{display:none}}
</style>
</head>
<body>
<h1>🐍 SNAKE</h1>
<p class="subtitle">SPARKIDDO ARCADE</p>
<div id="scoreboard">
  <div class="score-box"><div class="score-label">SCORE</div><div class="score-val" id="score">0</div></div>
  <div class="score-box"><div class="score-label">BEST</div><div class="score-val" id="best">0</div></div>
  <div class="score-box"><div class="score-label">LEVEL</div><div class="score-val" id="level">1</div></div>
</div>
<div id="canvas-wrap">
  <canvas id="c" width="400" height="400"></canvas>
  <div id="overlay">
    <h2>🐍 SNAKE</h2>
    <p>EAT FOOD. GROW. SURVIVE.</p>
    <button id="startBtn">▶ START GAME</button>
  </div>
</div>
<div id="mobile-btns">
  <div class="row"><button class="mbtn" id="up">▲</button></div>
  <div class="row"><button class="mbtn" id="left">◀</button><button class="mbtn" id="down">▼</button><button class="mbtn" id="right">▶</button></div>
</div>
<div id="controls">
  <span class="kbd">W</span> <span class="kbd">A</span> <span class="kbd">S</span> <span class="kbd">D</span> &nbsp;or&nbsp;
  <span class="kbd">↑</span> <span class="kbd">←</span> <span class="kbd">↓</span> <span class="kbd">→</span> &nbsp;to move
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const TILE=20,COLS=20,ROWS=20;
let snake,dir,next,food,score,best=0,lvl,speed,loop,running=false;

const COLORS={head:'#c084fc',body:'#7c3aed',food:'#f472b6',eye:'#fff',bg:'#0d0d1a',grid:'#12122a'};

function init(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};next={x:1,y:0};
  score=0;lvl=1;speed=150;
  placeFood();update();
  document.getElementById('overlay').style.display='none';
  running=true;
  clearInterval(loop);loop=setInterval(tick,speed);
}

function placeFood(){
  do{food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}

function tick(){
  dir={...next};
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
    gameOver();return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10*lvl;
    if(score>=lvl*100){lvl++;speed=Math.max(60,speed-15);clearInterval(loop);loop=setInterval(tick,speed);}
    placeFood();
  } else snake.pop();
  update();
}

function update(){
  document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=best;
  document.getElementById('level').textContent=lvl;
  draw();
}

function draw(){
  ctx.fillStyle=COLORS.bg;ctx.fillRect(0,0,400,400);
  // grid
  ctx.strokeStyle=COLORS.grid;ctx.lineWidth=.5;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*TILE,0);ctx.lineTo(i*TILE,400);ctx.stroke();}
  for(let j=0;j<=ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*TILE);ctx.lineTo(400,j*TILE);ctx.stroke();}
  // food glow
  ctx.save();ctx.shadowColor='#f472b6';ctx.shadowBlur=12;
  ctx.fillStyle=COLORS.food;
  ctx.fillRect(food.x*TILE+2,food.y*TILE+2,TILE-4,TILE-4);
  ctx.restore();
  // snake
  snake.forEach((s,i)=>{
    ctx.save();
    ctx.shadowColor=i===0?'#c084fc':'#7c3aed';ctx.shadowBlur=i===0?16:6;
    ctx.fillStyle=i===0?COLORS.head:COLORS.body;
    const r=i===0?5:3;
    roundRect(ctx,s.x*TILE+1,s.y*TILE+1,TILE-2,TILE-2,r);ctx.fill();
    ctx.restore();
    if(i===0){
      ctx.fillStyle=COLORS.eye;
      let ex=s.x*TILE+4,ey=s.y*TILE+4;
      if(dir.x===1){ex=s.x*TILE+TILE-6;ey=s.y*TILE+4;}
      if(dir.x===-1){ex=s.x*TILE+2;ey=s.y*TILE+4;}
      if(dir.y===1){ex=s.x*TILE+4;ey=s.y*TILE+TILE-6;}
      ctx.fillRect(ex,ey,4,4);ctx.fillRect(ex+6,ey,4,4);
    }
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function gameOver(){
  running=false;clearInterval(loop);
  if(score>best)best=score;
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<h2>💀 GAME OVER</h2><p class="final">SCORE: ${score}</p><p class="final" style="color:#a78bfa">BEST: ${best}</p><button id="startBtn">▶ PLAY AGAIN</button>`;
  ov.style.display='flex';
  document.getElementById('startBtn').addEventListener('click',init);
}

document.getElementById('startBtn').addEventListener('click',init);

const keyMap={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
  w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0},
  W:{x:0,y:-1},S:{x:0,y:1},A:{x:-1,y:0},D:{x:1,y:0}};

document.addEventListener('keydown',e=>{
  const d=keyMap[e.key];
  if(d&&!(d.x===-dir.x&&dir.x!==0)&&!(d.y===-dir.y&&dir.y!==0)){next=d;e.preventDefault();}
});

['up','down','left','right'].forEach(id=>{
  const el=document.getElementById(id);
  if(!el)return;
  const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  el.addEventListener('click',()=>{const d=map[id];if(!(d.x===-dir.x&&dir.x!==0)&&!(d.y===-dir.y&&dir.y!==0))next=d;});
});
</script>
</body>
</html>
